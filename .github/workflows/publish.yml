name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # required for npm trusted publishing (OIDC provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Check out the pushed tag. package.json's version is set to the release
      # version by release-please and must match the tag being published.
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Verify version matches pushed tag
        run: |
          PKG_VERSION="v$(node -e "process.stdout.write(require('./package.json').version)")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json version: $PKG_VERSION"
          echo "pushed tag:           $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch — package.json is $PKG_VERSION but tag is $TAG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Diagnose npm + OIDC environment
        run: |
          echo "which npm: $(which npm)"
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "--- effective .npmrc (userconfig) ---"
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" 2>/dev/null | sed 's/_authToken=.*/_authToken=<redacted>/' || echo "(none)"

      # setup-node writes an .npmrc with '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}'.
      # With no NODE_AUTH_TOKEN secret this becomes an empty/placeholder token that npm uses
      # for token auth, bypassing the OIDC trusted-publishing exchange (=> E401). Remove only
      # the _authToken line so the 'registry=' line remains and npm performs the OIDC exchange.
      - name: Remove token auth line so OIDC is used
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken=/d' "$NPMRC"
            echo "Scrubbed _authToken from $NPMRC"
          fi

      - name: Stage publish to npm
        run: npm stage publish --provenance
