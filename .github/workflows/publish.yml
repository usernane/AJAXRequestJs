name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write  # required for npm trusted publishing (OIDC provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Check out the pushed tag. package.json's version is set to the release
      # version by release-please and must match the tag being published.
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Verify version matches pushed tag
        run: |
          PKG_VERSION="v$(node -e "process.stdout.write(require('./package.json').version)")"
          TAG="${GITHUB_REF_NAME}"
          echo "package.json version: $PKG_VERSION"
          echo "pushed tag:           $TAG"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Version mismatch — package.json is $PKG_VERSION but tag is $TAG"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm to a trusted-publishing-capable version
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Diagnose npm + OIDC environment
        run: |
          echo "which npm: $(which npm)"
          echo "npm version: $(npm --version)"
          echo "node version: $(node --version)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"

      # setup-node writes an .npmrc containing an (empty) _authToken line and a legacy
      # always-auth key. npm then attempts (empty) token auth and skips the OIDC trusted-
      # publishing exchange. Remove both lines so npm 12 performs the OIDC exchange.
      - name: Scrub token/legacy auth config so OIDC is used
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i -e '/_authToken=/d' -e '/always-auth/d' "$NPMRC"
            echo "Scrubbed auth lines from $NPMRC:"
            cat "$NPMRC"
          fi

      - name: Stage publish to npm
        run: npm stage publish --provenance
